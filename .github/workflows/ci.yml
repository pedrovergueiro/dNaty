name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy>=1.24.0 scipy>=1.10.0 tqdm>=4.65.0
          pip install pytest

      - name: Run sanity tests
        run: pytest tests/test_sanity.py -v -x

      - name: Run edge case tests
        run: pytest tests/test_edge_cases.py -v -x

      - name: Run reproducibility tests
        run: pytest tests/test_reproducibility.py -v -x

      # Validates published benchmark numbers against quality thresholds (instant, JSON-only).
      # Heavy NAS suites (test_compress, test_market_validation) run locally — too slow for CI.
      - name: Validate market benchmark results
        run: pytest tests/test_benchmark_market.py -v -x

  # Creates the GitHub Release for every version tag that does not have one yet,
  # with notes taken from CHANGELOG.md. Idempotent: safe to run on every push.
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [backend-tests]
    permissions:
      contents: write
    concurrency: sync-releases

    steps:
      # Always read the changelog and script from main, so old tags get current notes.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create missing GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_releases.py
